<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Cek Transportasi</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1><i class="fas fa-route"></i> Cek Transportasi</h1>
            <p>Dapatkan informasi rute transportasi yang akurat</p>
        </header>

        <div class="search-container">
            <div class="search-box">
                <div class="input-group">
                    <i class="fas fa-map-marker-alt"></i>
                    <input type="text" id="origin" placeholder="Lokasi asal..." autocomplete="off">
                </div>
                <div class="input-group">
                    <i class="fas fa-map-marker"></i>
                    <input type="text" id="destination" placeholder="Lokasi tujuan..." autocomplete="off">
                </div>
                <button id="searchBtn" class="search-btn">
                    <i class="fas fa-search"></i> Cari Rute
                </button>
            </div>
        </div>

        <div class="transport-modes">
            <h3>Pilih Moda Transportasi:</h3>
            <div class="mode-buttons">
                <button class="mode-btn active" data-mode="transit">
                    <i class="fas fa-bus"></i> Transportasi Umum
                </button>
                <button class="mode-btn" data-mode="driving">
                    <i class="fas fa-car"></i> Mobil
                </button>
                <button class="mode-btn" data-mode="walking">
                    <i class="fas fa-walking"></i> Jalan Kaki
                </button>
                <button class="mode-btn" data-mode="bicycling">
                    <i class="fas fa-bicycle"></i> Sepeda
                </button>
            </div>
        </div>

        <div class="main-content">
            <div class="map-container">
                <div id="map"></div>
            </div>
            
            <div class="results-container">
                <div id="loading" class="loading hidden">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>Mencari rute...</p>
                </div>
                
                <div id="results" class="results hidden">
                    <h3>Hasil Pencarian</h3>
                    <div id="routeInfo"></div>
                    <div id="routeSteps"></div>
                </div>
                
                <div id="error" class="error hidden">
                    <i class="fas fa-exclamation-triangle"></i>
                    <p id="errorMessage"></p>
                </div>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="script.js"></script>
    <script async defer
        src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY&libraries=places&callback=initMap">
    </script>
</body>
</html>
